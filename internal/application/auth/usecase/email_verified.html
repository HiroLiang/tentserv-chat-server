<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="3;url=tentserv-chat://email-verified" />
  <title>Email Verified — Tentserv Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f1f5f9;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .hint {
      margin-top: 20px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Email 已驗證！</h1>
    <p class="subtitle">
      您的帳號已成功啟用。<br />
      Your account has been successfully activated.
    </p>
    <a class="btn" href="tentserv-chat://email-verified">開啟 Tentserv Chat</a>
    <p class="hint">將在 3 秒後自動跳轉 &middot; Auto-redirecting in 3 seconds&hellip;</p>
  </div>
</body>
</html>
