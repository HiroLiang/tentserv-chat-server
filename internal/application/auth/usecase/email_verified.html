<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="3;url=tentserv-chat://email-verified" />
  <title>Email Verified - Tentserv Chat</title>
  <style>
    :root {
      --background: 38 16.7% 90.6%;
      --card: 120 3.8% 64.1%;
      --card-foreground: 174 12.5% 15.7%;
      --primary: 174 12.5% 15.7%;
      --primary-foreground: 120 3.8% 64.1%;
      --muted-foreground: 240 3.8% 46.1%;
      --border: 240 5.9% 90%;
      --radius: 8px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(var(--background));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: hsl(var(--card-foreground));
      padding: 24px;
    }

    .card {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border: 1px solid hsl(var(--primary));
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: hsl(var(--primary));
      font-size: 24px;
      font-weight: 700;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: hsl(var(--card-foreground));
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      text-decoration: none;
      padding: 12px 32px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      transition: background 0.15s;
    }

    .btn:hover {
      background: hsl(174 12.5% 12%);
    }

    .hint {
      margin-top: 20px;
      color: hsl(var(--muted-foreground));
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">OK</div>
    <h1>Email 已驗證！</h1>
    <p class="subtitle">
      您的帳號已成功啟用。<br />
      Your account has been successfully activated.
    </p>
    <a class="btn" href="tentserv-chat://email-verified">開啟 Tentserv Chat</a>
    <p class="hint">將在 3 秒後自動跳轉 &middot; Auto-redirecting in 3 seconds&hellip;</p>
  </div>
</body>
</html>
