name: deploy.yml
on:
  push:
    branches: [ main, feature/dev ]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tentserv-chat-server
  TAG: ${{ github.ref == 'refs/heads/main' && '1.0.0-alpha-1' || 'dev' }}
  NETWORK_NAME: ${{ github.ref == 'refs/heads/main' && 'tentserv-net' || 'tentserv-net-dev' }}
  WORK_DIR: ${{ github.ref == 'refs/heads/main' && '/home/hiroliang/apps/tentserv_server' || '/home/hiroliang/apps/tentserv_server_dev' }}
  GOAT_SERVER_PORT: ${{ github.ref == 'refs/heads/main' && '8080' || '9090' }}
  GOAT_SERVER_NAME: ${{ github.ref == 'refs/heads/main' && 'tentserv-chat-server' || 'tentserv-chat-server-dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: goat-server-deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Setup Go environment
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      # Install dependencies
      - name: Install dependencies
        run: |
          make setup

      # Run tests (Unit + BDD)
      - name: Run Go tests
        run: |
          echo "Running Go tests..."
          make test

      # Set up Docker QEMU #
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Set up Docker Buildx #
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login to Docker Hub #
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Docker Image #
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          push: true

      # Authenticate to Google Cloud #
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Install stable gcloud CLI
      - name: Install specific gcloud version
        uses: google-github-actions/setup-gcloud@v3

      # Deploy to GCP VM #
      - name: Deploy image to GCP VM
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$GOOGLE_GHA_CREDS_PATH"
          GCP_VM_NAME="tentserv-vm"
          GCP_ZONE="asia-east1-a"
          
          gcloud compute ssh "${GCP_VM_NAME}" \
          --zone="$GCP_ZONE" \
          --tunnel-through-iap \
          --command "
            sudo -iu hiroliang bash -lc '
              set -e
          
              cd ${WORK_DIR}
          
              echo Stopping and removing old container...
              podman stop ${GOAT_SERVER_NAME} || true
              podman rm ${GOAT_SERVER_NAME} || true
              podman rmi ${IMAGE_NAME}:${TAG} || true
          
              echo Pulling latest image...
              podman pull docker.io/${IMAGE_NAME}:${TAG}
          
              echo Starting new container...
              podman run -d \
                --name ${GOAT_SERVER_NAME} \
                --network ${NETWORK_NAME} \
                -p ${GOAT_SERVER_PORT}:${GOAT_SERVER_PORT} \
                -v ./config:/app/config:ro \
                -v .env:/app/.env:ro \
                -v ./uploads:/app/uploads:rw \
                docker.io/${IMAGE_NAME}:${TAG}
          
              echo Done!
            '
          "
